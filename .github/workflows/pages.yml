name: Publicar e atualizar calendário

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.enabled.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Verificar se GitHub Pages foi ativado
        id: enabled
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              core.setOutput('ready', result.data.build_type === 'workflow' ? 'true' : 'false');
              if (result.data.build_type !== 'workflow') core.notice('Selecione GitHub Actions em Settings > Pages.');
            } catch (error) {
              if (![403,404].includes(error.status)) throw error;
              core.setOutput('ready', 'false');
              core.notice('Ative GitHub Pages em Settings > Pages; a versão pronta permanece no repositório.');
            }
      - uses: actions/configure-pages@v5
        if: steps.enabled.outputs.ready == 'true'
        id: pages
      - name: Instalar dependências
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Ler a primeira aba da planilha
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm sync:data
      - name: Recuperar a interface compilada desta versão
        if: steps.enabled.outputs.ready == 'true'
        uses: actions/cache@v4
        id: interface
        with:
          path: out
          key: pages-${{ runner.os }}-${{ github.sha }}-${{ steps.pages.outputs.base_path }}
      - name: Gerar o site estático
        if: steps.enabled.outputs.ready == 'true' && steps.interface.outputs.cache-hit != 'true'
        run: pnpm build:github
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Aplicar os dados atualizados
        if: steps.enabled.outputs.ready == 'true'
        run: |
          mkdir -p out/data
          cp public/data/calendar.json out/data/calendar.json
      - uses: actions/upload-pages-artifact@v4
        if: steps.enabled.outputs.ready == 'true'
        with:
          path: out
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
